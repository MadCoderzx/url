name: CD

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-publish:
    name: Build and publish Docker images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ vars.REGISTRY }}/${{ vars.IMAGE_OWNER }}/url-shortener-backend:latest
            ${{ vars.REGISTRY }}/${{ vars.IMAGE_OWNER }}/url-shortener-backend:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ vars.REGISTRY }}/${{ vars.IMAGE_OWNER }}/url-shortener-frontend:latest
            ${{ vars.REGISTRY }}/${{ vars.IMAGE_OWNER }}/url-shortener-frontend:${{ github.sha }}    

  deploy:
    name: Deployment
    needs: build-and-publish
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy or mock deployment
        run: |
          if [[ -n "${{ secrets.DEPLOY_HOST }}" && -n "${{ secrets.DEPLOY_USER }}" && -n "${{ secrets.DEPLOY_KEY }}" ]]; then
            echo "Deploying to ${{ secrets.DEPLOY_HOST }}"
            # Add actual deployment commands here, e.g. SSH + docker compose pull && docker compose up -d
          else
            echo "Deployment secrets not configured. Skipping actual deploy."
          fi
