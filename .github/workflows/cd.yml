name: CD

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-publish:
    name: Build and publish Docker images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ vars.REGISTRY }}/${{ vars.IMAGE_OWNER }}/url-shortener-backend:latest
            ${{ vars.REGISTRY }}/${{ vars.IMAGE_OWNER }}/url-shortener-backend:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ vars.REGISTRY }}/${{ vars.IMAGE_OWNER }}/url-shortener-frontend:latest
            ${{ vars.REGISTRY }}/${{ vars.IMAGE_OWNER }}/url-shortener-frontend:${{ github.sha }}    

  deploy:
      name: Deploy to Render
      needs: build-and-publish
      runs-on: ubuntu-latest
      steps:
        - name: Trigger backend deploy on Render
          run: |
            curl -s "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}" \
              --fail \
              -o /dev/null \
              -w "Backend deploy triggered: HTTP %{http_code}\n"
  
        - name: Trigger frontend deploy on Render
          run: |
            curl -s "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}" \
              --fail \
              -o /dev/null \
              -w "Frontend deploy triggered: HTTP %{http_code}\n"
