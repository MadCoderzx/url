name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: urlshortener
          POSTGRES_USER: urluser
          POSTGRES_PASSWORD: urlpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U urluser -d urlshortener"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Cache backend dependencies
        uses: actions/cache@v4
        with:
          path: backend/node_modules
          key: backend-deps-${{ hashFiles('backend/package-lock.json') }}
          restore-keys: |
            backend-deps-

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Wait for Postgres
        run: |
          until bash -c "</dev/tcp/localhost/5432" 2>/dev/null; do
            sleep 2
          done

      - name: Run backend database setup
        run: npm run db:init
        working-directory: backend
        env:
          DATABASE_URL: postgres://urluser:urlpass@localhost:5432/urlshortener

      - name: Run backend lint
        run: npm run lint
        working-directory: backend

      - name: Run backend tests
        run: npm test
        working-directory: backend
        env:
          DATABASE_URL: postgres://urluser:urlpass@localhost:5432/urlshortener

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Cache frontend dependencies
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: frontend-deps-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            frontend-deps-

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Run frontend lint
        run: npm run lint
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend
