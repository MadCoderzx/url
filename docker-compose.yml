services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    env_file:
      - .env

    environment:
      DATABASE_URL: ${DATABASE_URL}
      PORT: 4000

    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    ports:
      - "3000:80"
    depends_on:
      - backend