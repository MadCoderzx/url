name: CD

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-publish:
    name: Build and publish Docker images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---------------- BACKEND ----------------
      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner@lower }}/url-shortener-backend:latest
            ghcr.io/${{ github.repository_owner@lower }}/url-shortener-backend:${{ github.sha }}

      # ---------------- FRONTEND ----------------
      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner@lower }}/url-shortener-frontend:latest
            ghcr.io/${{ github.repository_owner@lower }}/url-shortener-frontend:${{ github.sha }}

  deploy:
    name: Deployment
    needs: build-and-publish
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy or mock deployment
        run: |
          if [[ -n "${{ secrets.DEPLOY_HOST }}" && -n "${{ secrets.DEPLOY_USER }}" && -n "${{ secrets.DEPLOY_KEY }}" ]]; then
            echo "Deploying to ${{ secrets.DEPLOY_HOST }}"
            # Example:
            # ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            # "docker pull ghcr.io/${{ github.repository_owner }}/url-shortener-backend:latest &&
            #  docker compose up -d"
          else
            echo "Deployment secrets not configured. Skipping actual deploy."
          fi
